{{define "content"}}
<div class="no-print bg-wesco text-white px-4 py-3 sticky top-0 z-30 shadow flex items-center gap-3">
  <a href="/" class="inline-flex items-center justify-center w-9 h-9 rounded-full hover:bg-wesco-dark active:bg-wesco-dark" aria-label="Done">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="flex-1">
    <div class="text-[11px] uppercase tracking-wider text-wesco-light/80 leading-none">Order complete</div>
    <div class="text-base font-semibold leading-tight">{{.Order.Number}} · {{.Order.Customer.CompanyName}}</div>
  </div>
  <button type="button" onclick="window.print()" class="px-3 py-2 rounded-xl bg-white text-wesco font-semibold text-sm">Print</button>
</div>

<div class="bg-gray-100 py-4 print:py-0 print:bg-white">
  {{template "consignment" .}}
  {{template "packing" .}}
  {{template "invoice" .}}
</div>
{{end}}
